id: A.1
title: Regular tab moved to another space, sidebar open
section: Section A - Tab moved between spaces
initial_sidebar: open

fixture:
  spaces:
    - name: Work
    - name: Video

steps:
  - action: open_regular_tab
    url: https://example.com/regular-a
    space: Work
    as: tab1

  - assert: tab_in_space
    tab: tab1
    space: Work

  - action: move_tab_to_group
    tab: tab1
    space: Video

  - assert: tab_in_space
    tab: tab1
    space: Video
